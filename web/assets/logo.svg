<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a08"/>
      <stop offset="100%" stop-color="#0c1812"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#055536"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#009955"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Hexagon/Rounded Rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#1a3d2c" stroke-width="6"/>

  <!-- Circuit Grid Background Lines -->
  <path d="M 60 140 H 180 V 220 H 260" stroke="#00ff88" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <path d="M 452 140 H 332 V 220 H 252" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <path d="M 120 400 H 200 V 320" stroke="#00ff88" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <path d="M 392 400 H 312 V 320" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <circle cx="180" cy="220" r="4" fill="#00ff88" opacity="0.6"/>
  <circle cx="332" cy="220" r="4" fill="#00d2ff" opacity="0.6"/>

  <!-- Outer Cyber Shield -->
  <path d="M 256 60 L 416 130 V 270 C 416 360 256 440 256 440 C 256 440 96 360 96 270 V 130 Z" 
        fill="#07120c" stroke="url(#shieldGrad)" stroke-width="8" filter="url(#neonGlow)"/>

  <!-- Inner Shield Trim -->
  <path d="M 256 90 L 386 148 V 262 C 386 336 256 404 256 404 C 256 404 126 336 126 262 V 148 Z" 
        fill="none" stroke="#00ff88" stroke-width="2.5" stroke-dasharray="12 6" opacity="0.7"/>

  <!-- Central Terminal / Security Lock / Eye Core -->
  <g transform="translate(186, 170)">
    <!-- Lock Body / Cyber Core -->
    <rect x="20" y="55" width="100" height="85" rx="16" fill="#0c2016" stroke="#00ff88" stroke-width="4"/>
    <!-- Lock Shackle -->
    <path d="M 40 55 V 32 C 40 15 53 2 70 2 C 87 2 100 15 100 32 V 55" 
          fill="none" stroke="#00d2ff" stroke-width="7" stroke-linecap="round"/>
    <!-- Center Keyhole / Binary Core -->
    <circle cx="70" cy="90" r="14" fill="#00ff88" filter="url(#neonGlow)"/>
    <path d="M 66 94 L 62 120 H 78 L 74 94 Z" fill="#00ff88"/>
    <!-- Terminal Prompt Accent -->
    <path d="M -15 28 L 5 44 L -15 60" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="12" y1="62" x2="28" y2="62" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Stars / Digital Sparkles -->
  <circle cx="256" cy="120" r="4" fill="#00ff88"/>
  <circle cx="216" cy="360" r="3" fill="#00d2ff"/>
  <circle cx="296" cy="360" r="3" fill="#00ff88"/>
</svg>
